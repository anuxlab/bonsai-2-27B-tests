name: Bonsai 2 27B Capability Evaluation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Evaluation pipeline
        type: choice
        required: true
        default: all
        options: [basic, thinking, coding, agentic, advanced, vision, all]
      repeat:
        description: Repetitions per test (use 1 for CI)
        type: number
        default: 1
      max_tokens:
        description: Generation token limit
        type: number
        default: 2048
      thinking:
        description: Thinking mode
        type: choice
        options: [auto, on, off]
        default: auto
  workflow_call:
    inputs:
      model_url: {required: true, type: string}
      projector_model_url: {required: true, type: string}
      model_name: {required: true, type: string}
      projector_model_name: {required: true, type: string}
      context_size: {required: false, type: string, default: "8192"}
      suite: {required: false, type: string, default: "basic"}
      repeat: {required: false, type: number, default: 1}
      max_tokens: {required: false, type: number, default: 2048}
      thinking: {required: false, type: string, default: "auto"}

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MODEL_URL: ${{ inputs.model_url || 'https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf/resolve/main/Ternary-Bonsai-2-27B-PQ2_0.gguf?download=true' }}
      MMPROJ_URL: ${{ inputs.projector_model_url || 'https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf/resolve/main/Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf?download=true' }}
      MODEL_NAME: ${{ inputs.model_name || 'Ternary-Bonsai-2-27B-PQ2_0.gguf' }}
      MMPROJ_NAME: ${{ inputs.projector_model_name || 'Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf' }}
      CTX: ${{ inputs.context_size || '8192' }}
      SUITE: ${{ inputs.suite || github.event.inputs.suite || 'basic' }}
      REPEAT: ${{ inputs.repeat || github.event.inputs.repeat || '1' }}
      MAX_TOKENS: ${{ inputs.max_tokens || github.event.inputs.max_tokens || '2048' }}
      THINKING: ${{ inputs.thinking || github.event.inputs.thinking || 'auto' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install runner dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq python3
      - name: Add swap (best-effort)
        run: |
          sudo fallocate -l 8G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true
          free -h
      - name: Download model and projector
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors "$MODEL_URL" -o "$MODEL_NAME"
          curl -fL --retry 5 --retry-all-errors "$MMPROJ_URL" -o "$MMPROJ_NAME"
          sha256sum "$MODEL_NAME" "$MMPROJ_NAME" | tee model_hashes.txt
          df -h
      - name: Download Prism llama.cpp runtime
        run: |
          set -euo pipefail
          BIN_URL="https://github.com/PrismML-Eng/llama.cpp/releases/download/prism-b10777-e3de715/llama-prism-b10777-e3de715-bin-ubuntu-x64.tar.gz"
          curl -fL --retry 5 "$BIN_URL" -o runtime.tar.gz
          mkdir -p bin
          tar -xzf runtime.tar.gz -C bin --strip-components=1
          chmod +x bin/llama-server
          ./bin/llama-server --version || true
      - name: Start server
        run: |
          set -euo pipefail
          nohup ./bin/llama-server -m "./$MODEL_NAME" --mmproj "./$MMPROJ_NAME"             -ngl 0 -fa on -c "$CTX" -t 4 --jinja --port 8080             > server.log 2>&1 &
          echo $! > server.pid
      - name: Wait for readiness
        run: |
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              cat server.log
              exit 1
            fi
            sleep 2
          done
          cat server.log
          exit 1
      - name: Run selected tests
        run: |
          python3 scripts/evaluate.py --base-url http://127.0.0.1:8080/v1             --suites "$SUITE" --repeat "$REPEAT" --max-tokens "$MAX_TOKENS" --thinking "$THINKING"
      - name: Server diagnostics
        if: always()
        run: |
          echo "## Runner memory / disk" >> "$GITHUB_STEP_SUMMARY"
          free -h >> "$GITHUB_STEP_SUMMARY" || true
          df -h >> "$GITHUB_STEP_SUMMARY" || true
          tail -n 250 server.log > server_tail.log || true
      - name: Upload run results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-27b-${{ github.run_id }}-${{ github.event.inputs.suite || inputs.suite || 'basic' }}
          path: |
            results/
            server.log
            server_tail.log
            model_hashes.txt
            runtime.tar.gz
          if-no-files-found: warn
          retention-days: 30
