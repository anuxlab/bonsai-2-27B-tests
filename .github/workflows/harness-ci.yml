name: Harness CI (no model needed)
on:
  push:
    paths: ["bench/**", "tests/**", "scripts/**", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
      - name: Graders + references + full pipeline against a fake server
        run: python3 -m bench selftest --e2e
